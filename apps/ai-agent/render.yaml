# Render blueprint: the AI backend as three independently deployable services from ONE image.
# Roles are chosen with SERVICE_ROLE (see apps/ai-agent/app/roles.py). Secrets (sync: false) are entered
# in the Render dashboard, never committed. Point the web app at each service with
# AI_TUTOR_URL, AI_KNOWLEDGE_URL and AI_STUDIO_URL (or BACKEND_URL if you run a single combined service).
envVarGroups:
  - name: entropy-ai-shared
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: AI_BACKEND_TOKEN
        sync: false            # shared secret; same value as the web app's AI_BACKEND_TOKEN
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        sync: false            # Supabase pooled connection string
      - key: DIRECT_URL
        sync: false
      - key: PINECONE_API_KEY
        sync: false            # optional: without it, document search uses Postgres
      - key: PINECONE_INDEX_NAME
        value: entropy-ai
      - key: NEO4J_URI
        sync: false            # neo4j+s://<id>.databases.neo4j.io
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

services:
  - type: web
    name: entropy-ai-tutor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: apps/ai-agent
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: entropy-ai-shared
      - key: SERVICE_ROLE
        value: tutor

  - type: web
    name: entropy-ai-knowledge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: apps/ai-agent
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: entropy-ai-shared
      - key: SERVICE_ROLE
        value: knowledge

  - type: web
    name: entropy-ai-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: apps/ai-agent
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: entropy-ai-shared
      - key: SERVICE_ROLE
        value: studio
