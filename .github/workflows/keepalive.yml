# Render's free plan puts a service to sleep after ~15 idle minutes, and waking it takes 30-60 s, which is longer than a
# web request is allowed to wait. Pinging /health every 10 minutes keeps the AI service awake. GitHub cron is best-effort
# (runs can be delayed), so the web app also retries once while the service wakes (apps/app/app/api/ai-agent/qa/stream).
name: keep-ai-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://entropy-ai.onrender.com/health
