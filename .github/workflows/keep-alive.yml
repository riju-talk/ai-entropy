name: Keep services warm

# Render's free plan sleeps after 15 minutes idle. Neo4j Aura Free pauses after
# ~3 days idle. /health touches the app and Neo4j, so one ping serves both.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ vars.AI_AGENT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Set the repository variable AI_AGENT_HEALTH_URL (e.g. https://entropy-ai-agent.onrender.com/health)"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o health.json -w "%{http_code}" --max-time 60 "$HEALTH_URL" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          cat health.json || true
          [ "$code" = "200" ]
